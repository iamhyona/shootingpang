/* ---------- 게임판 (논리 좌표 420×620 · 화면에 맞춰 선명하게 확대) ---------- */

const PP={get:(k,d)=>window.phPref?phPref.get(k,d):d,set:(k,v)=>{if(window.phPref)phPref.set(k,v)}};let FX=true,GUIDE=true;
function layout(){DPR=Math.min(window.devicePixelRatio||1,3);cv.style.width=cv.style.height="0px";
  const f=document.querySelector(".bw").getBoundingClientRect();H=Math.round(Math.max(620,Math.min(800,W*(f.height-10)/Math.max(1,f.width-10))));LAUNCH.y=H-61;SC=Math.max(.3,Math.min((f.width-10)/W,(f.height-10)/H));
  const w=Math.floor(W*SC),h=Math.floor(H*SC);SC=w/W;cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+"px";cv.style.height=h+"px";draw()}
const pos=(r,c)=>({x:R+r%2*R+c*STEP,y:TOP+r*DY});
const valid=(r,c)=>r>=0&&r<14&&c>=0&&c<(r%2?9:10);
const key=(r,c)=>r+","+c;
const near=(a,b)=>{const p=pos(a.r,a.c),q=pos(b.r,b.c);return Math.hypot(p.x-q.x,p.y-q.y)<STEP+1};
function neighbors(b){return board.filter(a=>a!==b&&near(a,b))}
function group(b,filter=()=>true){const seen=new Set([b]),q=[b];for(let i=0;i<q.length;i++)for(const n of neighbors(q[i]))if(!seen.has(n)&&filter(n)){seen.add(n);q.push(n)}return q}

function pick(){const cs=available();return cs[Math.floor(Math.random()*cs.length)]||1}
/* 스테이지 배치: 같은 난도·스테이지는 늘 같은 모양 (다시 해도 공평) · 모든 줄은 천장에 매달림 */
function createStage(mode,number){

  const progress=Math.min(1,(number-1)/(level.limit-1));

  const cells=[];
  for(let r=0;r<10;r++)for(let c=0;c<(r%2?9:10);c++){const x=c+r%2*.5;const shape=[0,Math.abs(x-4.5)*.24,(x%3)*.45,Math.sin(x*1.4)*.65,Math.abs(x-2)*.18+Math.cos(x*2)*.5][pattern];cells.push({r,c,priority:r+shape*(1+progress*.8)+random()*level.jag}) /* 어려울수록 가장자리 모양이 들쭉날쭉 */}

function snap(x,y){const occ=new Set(board.map(b=>key(b.r,b.c))),cand=[];

function shoot(){if(state!=="play"||shot||busy||shots<=0)return;window.phHaptic&&phHaptic(12); /* 쏘는 순간 톡 */shot={x:LAUNCH.x,y:LAUNCH.y,vx:Math.cos(angle)*760,vy:Math.sin(angle)*760,color:current};shots--;whoosh();hud()}

function resolve(cell){cell.lt=NOW;cell.ph=Math.random()*6.28;board.push(cell);

/* ---------- 효과 ---------- */
function burst(m,drops){const k=1,mul=Math.min(2.6,1.4+(combo-1)*.4);

function sprite(c,mood,x,y,sc,sx,sy,alpha){const im=IMG[mood+c];if(!im||!im.complete)return;const z=R*2.16*sc;cx.save();cx.globalAlpha=alpha??1;cx.translate(x,y);cx.scale(sx||1,sy||1);cx.drawImage(im,-z/2,-z/2,z,z);cx.restore()}
